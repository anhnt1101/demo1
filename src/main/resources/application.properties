#db nta

spring.application.name=demo1
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xepdb1
spring.datasource.username=system
spring.datasource.password=NTA
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect



jwt.secret=doi-chuoi-nay-thanh-random-string-that-dai-toi-thieu-32-ky-tu-khi-len-prod
jwt.expiration-ms=86400000

# ==================================================
# MINIO
# ==================================================

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket=payment-hub-exports


# ==================================================
# EXPORT
# ==================================================

# SXSSF gi? 200 row trong RAM
export.sxssf-window-size=500

# Oracle JDBC l?y 1000 row m?i fetch
export.jdbc-fetch-size=20000

# Presigned URL t?n t?i 1 ngày
export.presigned-url-expiry-minutes=1440

# File Excel t?m
export.temp-dir=${java.io.tmpdir}

# Dùng cho MinIO lifecycle
export.retention-days=7


# ==================================================
# HIKARI
# ==================================================

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5

# ==================================================
# KAFKA
# ==================================================
# Job quét export PROCESSING b? k?t, ch?y m?i 60s
export.stale-check-interval-ms=60000
# PROCESSING quá 120 phút coi nh? worker ?ã crash -> ERROR
export.stale-after-minutes=120

# ? nhà
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer group c?a Export Worker
spring.kafka.consumer.group-id=export-workers

# N?u consumer group m?i thì ??c message t? ??u
spring.kafka.consumer.auto-offset-reset=earliest

# Serializer Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Deserializer Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# M?t consumer poll m?t job m?t l?n
spring.kafka.consumer.max-poll-records=1

# Export có th? ch?y lâu.
# 3 gi? = 10.800.000 ms
spring.kafka.consumer.properties[max.poll.interval.ms]=10800000

# Commit offset sau khi listener x? lý xong record
spring.kafka.listener.ack-mode=record

# Topic dùng cho export
export.kafka.topic=export_jobs

# S? consumer ch?y song song
export.kafka.concurrency=2
# ==================================================
# REDIS
# ==================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

export.redis.channel=export-events
export.redis.progress-ttl-hours=24

# ==================================================
# WEBSOCKET
# ==================================================

# Nhi?u origin cách nhau d?u ph?y, ví d?:
# export.websocket.allowed-origins=https://a.com,https://b.com
export.websocket.allowed-origins=http://localhost:4200


# (thêm vào ngay d??i export.kafka.concurrency=2)
# Timeout ch? Kafka ack khi publish (giây), h? t? 10s -> 5s
export.kafka.publish-timeout-seconds=5